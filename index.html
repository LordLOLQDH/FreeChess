<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="shortcut icon" href="./favicon.ico">
    <meta property="og:title" content="FreeChess - by Adam Kraus">
    <meta property="og:description" content="Play chess for free. No paywall, no premium.">
    <meta property="og:image" content="https://lordlolqdh.github.io/FreeChess/android-chrome-512x512.png">
    <meta property="og:url" content="https://lordlolqdh.github.io/FreeChess/">
    <meta name="twitter:card" content="summary_large_image">
    <title>FreeChess - by Adam Kraus</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; overscroll-behavior:none; touch-action:none; }
        .watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70vmin; height: 70vmin;
            background-image: url('./android-chrome-512x512.png'); background-repeat: no-repeat; background-size: contain; background-position: center;
            filter: invert(1) brightness(1.2); opacity: 0.05; pointer-events: none !important; z-index: 0;
        }
        .game--cont { width:100vw; width:100dvw; height:100dvh; display:flex; justify-content:center; align-items:center; position:relative; overflow:hidden; z-index: 1; }
        .game { width:100vw; width:100dvw; height:min(100dvw,100dvh); max-width:100dvw; max-height:100dvh; position:relative; flex:0 0 auto; }
        .game canvas { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:10 !important; pointer-events:auto !important; touch-action:none; }
        .board-cont { position:absolute; left:0; top:0; width:480px; height:480px; transform-origin:top left; z-index:1; pointer-events:none !important; }
        .board-cont div { position:absolute; }
    </style>
</head>
<body>
    <div class="watermark"></div>
    <div class="game--cont"><div class="game"><canvas id="board"></canvas><div class="board-cont"></div></div></div>

    <!-- FIXED ORDER: chess.js muss zuerst kommen, aber Version 0.10.3 nutzen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <!-- Dann Utils (getSqre, getBoardIndex) -->
    <script src="utils.js?v=20260825-5"></script>

    <!-- Dann Globals (FIXED Version!) -->
    <script src="general.js?v=20260825-5"></script>

    <!-- Dann Board / Pieces -->
    <script src="pieces.js?v=20260825-5"></script>
    <script src="board.js?v=20260825-5"></script>

    <!-- Dann Rules Engine -->
    <script src="rules.js?v=20260825-5"></script>

    <!-- Dann Main + Sound + Stockfish -->
    <script src="main.js?v=20260825-5"></script>
    <script src="sound.js?v=20260825-5"></script>
    <script src="stockfish.js?v=20260825-5"></script>

    <!-- ZULETZT Controls (FIXED) -->
    <script src="controls.js?v=20260825-5"></script>
    <script src="mobile.js?v=20260825-5"></script>
    <script src="stats.js?v=20260825-5"></script>
    <script src="game-ui.js?v=20260825-5"></script>
</body>
</html>
