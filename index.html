<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background-color: black;
            overscroll-behavior: none; touch-action: none;
        }
        .game--cont { width:100vw; width:100dvw; height:100dvh; min-height:100dvh; display:flex; justify-content:center; align-items:center; position:relative; overflow:hidden; }
        .game { width:100vw; width:100dvw; height:min(100vw,100dvw); height:min(100dvw,100dvh); max-width:100dvw; max-height:100dvh; position:relative; flex:0 0 auto; }
        .game canvas { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:999; touch-action:none; }
        .board-cont { position:absolute; left:0; top:0; width:480px; height:480px; transform-origin:top left; z-index:1; pointer-events:none; }
        .board-cont div { position:absolute; }
    </style>
    <title>FreeChess - by Adam Kraus</title>
</head>
<body>
    <div class="game--cont"><div class="game"><canvas></canvas><div class="board-cont"></div></div></div>
    <script src="general.js"></script>
    <script src="sound.js"></script>
    <script src="stockfish.js"></script>
    <script src="board.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/chess.min.js"></script>
    <script src="rules.js"></script>
    <script src="pieces.js"></script>
    <script src="utils.js"></script>
    <script src="main.js"></script>
    <script src="mobile.js"></script>
    <script src="controls.js"></script>
    <script src="stats.js"></script>
    <script src="game-ui.js"></script>
</body>
</html>
